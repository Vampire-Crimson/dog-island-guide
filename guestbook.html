<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Guestbook</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <div id="header-placeholder"></div>
        <main>
            <h1>Guestbook</h1>
            <small style="color: #AA1111; font-size: 1.125rem; display: block; text-align: center;">NOTE: Guestbook submissions are not currently being saved.</small>
            <form id="guestbook" novalidate>
                <label for="name">Name*</label>
                <input type="text" id="name" name="name" required placeholder="Enter name here">
                <span id="nameError" style="display: none; color: #AA1111;">⚠ Name cannot be empty</span>
                <label for="comment">Comment</label>
                <textarea id="comment" name="comment" maxlength="500" placeholder="Enter comment here (optional)"></textarea>
                <span id="commentError" style="display: none; color: #AA1111;">⚠ Comment must not be longer than 500 characters</span>
                <button type="submit" class="submit-button">Submit</button>
            </form>
            <div id="successMessage" style="display: none; text-align: center;">
                <img src="images/dogs/MrPostman.webp" alt="Mr. Postman" style="width: 50%; height: auto;">
                <p style="font-size: 1.875rem;">Thanks for stopping by THE DOG Island Guide!</p>
            </div>
        </main>
        <div id="footer-placeholder"></div>
        <script>fetch("header.html").then(response => response.text()).then(headerContent => document.getElementById("header-placeholder").innerHTML = headerContent)</script>
        <script>fetch("footer.html").then(response => response.text()).then(footerContent => document.getElementById("footer-placeholder").innerHTML = footerContent)</script>
        <script>
            const form = document.getElementById("guestbook");
            const nameInput = document.getElementById("name");
            const commentInput = document.getElementById("comment");
            const nameError = document.getElementById("nameError");
            const commentError = document.getElementById("commentError");
            const successMessage = document.getElementById("successMessage");
            nameInput.addEventListener("blur", () => {
                if (nameInput.value.trim() === "") {
                    nameError.style.display = "inline";
                }
                else {
                    nameError.style.display = "none";
                }
            });
            commentInput.addEventListener("input", () => {
                if (commentInput.value.length >= 500) {
                    commentError.style.display = "inline";
                }
                else {
                commentError.style.display = "none";
                }
            });
            form.addEventListener("submit", (event) => {
                event.preventDefault();
                if (nameInput.value.trim() === "") {
                    nameError.style.display = "inline";
                    return;
                }
                form.style.display = "none";
                successMessage.style.display = "block";
            });
        </script>
    </body>
</html>
